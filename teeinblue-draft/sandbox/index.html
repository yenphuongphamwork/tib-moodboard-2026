<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@700&family=Lato:wght@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/fonts/la-solid-900.woff2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
<style>
/* custom fonts of the demo store (portal > Upload Fonts, files from cdn.teeinblue.com, 12/10) */
@font-face { font-family: "Paris Forbel TTF"; src: url("assets/paris-forbel.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "hellohoney"; src: url("assets/hellohoney.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Patung"; src: url("assets/patung.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Shorelines Script Bold"; src: url("assets/shorelines-script-bold.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "BebasNeue"; src: url("assets/bebasneue.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "aAbstractGroovy"; src: url("assets/a-abstract-groovy.woff2") format("woff2"); font-display: swap; }

/* Studio frame — colours/sizes measured from the real artwork editor (portal, 09/10/2026) */
:root {
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --primary: #0d268f;
  --bb-h: 44px;
  --top-h: 45px;
  --left-w: max(25vw, 300px);   /* portal: col-lg-3 = 25% each side (395/396px at 1584); 300px floor for small laptops */
  --right-w: max(25vw, 300px);
  --panel: #464646;
  --row: #535353;
  --row-sel: #6b6b6b;
  --bar: #343a40;
  --toolbar: #414141;
  --stage: #262626;
  --card: #f8f8f8;
  --sel: #13c4d4;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--ui); font-size: 14px; color: #212529; background: #fff; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }
.sbx { position: fixed; inset: 0; display: grid; grid-template-rows: var(--bb-h) var(--top-h) 1fr; }

/* mock browser bar (sandbox chrome, not part of the studio) */
.bbar { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: #dee1e6; border-bottom: 1px solid #c8ccd2; min-width: 0; }
.bbar .dots { display: inline-flex; gap: 7px; flex: none; }
.bbar .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.bbar .dots i:nth-child(2) { background: #febc2e; }
.bbar .dots i:nth-child(3) { background: #28c840; }
.bbar .addr { flex: 0 1 420px; min-width: 0; height: 30px; border-radius: 15px; background: #fff; display: flex; align-items: center; gap: 7px; padding: 0 14px; font-size: 13.5px; color: #3c4043; white-space: nowrap; overflow: hidden; }
.bbar .addr i { color: #5f6368; font-size: 14px; }
.bbar .sp { flex: 1; }
.bbar .addr { flex: 0 1 380px; }
/* sandbox controls in the fake browser bar (Phượng 12/10: M1 + coloured buttons; colours from the brand guideline) */
.bb-reset { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border: 1px solid #DEDEDE; border-radius: 15px; background: #fff; color: #3c4043; font-size: 13.5px; white-space: nowrap; }
.bb-reset:hover { background: #f1f3f4; }
.bb-reset i { font-size: 15px; }
.bb-chip { margin-left: auto; flex: none; font-size: 12px; font-weight: 600; color: #fff; background: #1350DE; border-radius: 10px; padding: 2px 9px; }
.bb-info { font-size: 13px; color: #3c4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bb-install { flex: none; background: #FED678; color: #091040; font-weight: 600; font-size: 14px; padding: 6px 16px; border-radius: 3px; text-decoration: none; white-space: nowrap; }
.bb-install:hover { background: #FFC229; }
/* full-screen toggle: only when the sandbox sits inside a page section (iframe); like the old tour player */
.bb-fs { margin-left: auto; flex: none; height: 30px; border: 1px solid #DEDEDE; border-radius: 15px; background: #fff; color: #3c4043; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; white-space: nowrap; }
.bb-fs i { font-size: 16px; }
.bb-fs:hover { background: #f1f3f4; }
.bb-fs[hidden] { display: none; }

.bbar .linkbtn { color: #3c4043; font-size: 14px; }
.bbar .btn-primary { font-size: 14px; padding: 5px 14px; }

/* top bar */
.top { display: flex; align-items: center; padding: 0 8px; box-shadow: 0 0 0 1px rgba(57,76,96,.15); background: #fff; gap: 12px; min-width: 0; position: relative; z-index: 3; }
.top-title { font-size: 17.6px; line-height: 26.4px; font-weight: 600; color: #212529; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 0; }
.top-title small { font-size: 14px; color: #212529; font-weight: 400; margin-left: 8px; }
.mode { display: inline-flex; background: #e9ecef; border-radius: 6px; padding: 2px; flex: none; }
.mode button { border: 0; background: transparent; color: #212529; font-size: 13.6px; line-height: 13.6px; font-weight: 600; height: 25.3px; padding: 5.6px 14.4px; border-radius: 4px; display: inline-flex; align-items: center; gap: 5px; }
.mode button.on { background: var(--primary); color: #fff; }
.top-right { flex: 1 1 0; display: flex; justify-content: flex-end; align-items: center; gap: 14px; min-width: 0; }
.badge { font-size: 12.5px; color: #6b5d00; background: #fff6cc; border: 1px solid #f0de86; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
.linkbtn { border: 0; background: none; color: #888; font-size: 15px; padding: 6px 4px; white-space: nowrap; }
.linkbtn:hover { color: #555; }
.btn-primary { border: 1px solid var(--primary); background: var(--primary); color: #fff; font-size: 16px; padding: 7px 18px; border-radius: 3px; text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; }
.btn-primary:hover { background: #0a1f75; }
/* History / Cancel / Save & Close — measured from the real editor (09/10) */
.hist-btn { border: 1px solid transparent; background: none; color: #007bff; font-size: 14.4px; padding: 6px 12px; border-radius: 3px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.hist-btn i { font-size: 16px; }
.cancel-btn { border: 1px solid transparent; background: none; color: #888; font-size: 16px; padding: 6px 12px; border-radius: 3px; white-space: nowrap; }
.save-grp { display: inline-flex; height: 38px; flex: none; }
.save-grp button { border: 0; background: var(--primary); color: #fff; font-size: 16px; }
.save-grp .main { padding: 0 13px 0 21px; border-radius: 3px 0 0 3px; white-space: nowrap; }
.save-grp .dd { width: 19px; border-left: 1px solid rgba(255,255,255,.45); border-radius: 0 3px 3px 0; padding: 0; font-size: 12px; }
.top-right { gap: 0; }

/* body columns */
.body { display: grid; grid-template-columns: var(--left-w) 1fr var(--right-w); min-height: 0; }
.sbx.live .body { grid-template-columns: 0 1fr var(--right-w); }
.sbx.live .left { visibility: hidden; }
/* Preview Options (15/10 Phượng: make it work like the portal): the tab slides the form panel out/in (portal .artwork-form-panel: .2s ease-out).
   .pvc = panel closed; .pvanim only while toggling, so Edit/Live switches don't animate and the canvas fit stays right */
.sbx.pvc .body { grid-template-columns: var(--left-w) 1fr 0; }
.sbx.live.pvc .body { grid-template-columns: 0 1fr 0; }
.sbx.pvc .right { overflow: hidden; box-shadow: none; }
.sbx.pvanim .body { transition: grid-template-columns .2s ease-out; }
.sbx.pvanim .pvopt { transition: left .2s ease-out; }
.sbx.pvc .pvopt { left: calc(100% - 27px); }

/* left panel — from the portal's own CSS (artwork-sortable-layer*, afb__*, alab-*, 12/10) */
.left { background: var(--panel); color: #fff; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tplbar { height: 40px; display: flex; align-items: center; background: #464646; flex: none; }
.tpltab { background: #535353; height: 40px; width: 130px; display: flex; align-items: center; gap: 4px; padding: 8px; font-size: 12.6px; box-shadow: 1px 0 rgba(0,0,0,.3); white-space: nowrap; }
.tpltab .las { cursor: grab; }
.tplbar .sp { flex: 1; }
.tpl-act { width: 80px; height: 40px; background: #3a3a3a; display: flex; align-items: center; justify-content: space-around; }
.tpl-act button { border: 0; background: none; color: #eee; font-size: 12.6px; padding: 4px; }
.iconbtn { border: 0; background: none; color: #ddd; width: 30px; height: 30px; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; }
.iconbtn:hover { background: rgba(255,255,255,.08); color: #fff; }
.subbar { height: 37px; background: var(--bar); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.6px; flex: none; }
.subbar .tpl-i { border: 0; background: none; color: #ccc; font-size: 12.6px; padding: 2px 3px; }
.selbar { height: 37px; background: #fff; color: #343a40; display: flex; align-items: center; justify-content: space-between; padding: 0 15px 0 6px; font-size: 14px; flex: none; }
.selbar .l { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.selbar .l button { border: 0; background: none; color: #6c757d; font-size: 16px; padding: 0; display: inline-flex; }
.alab { display: flex; align-items: center; gap: 10px; }
.alab button { border: 0; background: none; padding: 0; width: 18px; height: 18px; color: #212529; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.alab button svg { width: 16px; height: 16px; fill: #272727; }
.alab button[disabled] { opacity: .65; cursor: default; }
.alab .dv { width: 1px; height: 16px; background: #adb5bd; margin: 0 -4px; }
.filter { height: 37px; display: flex; align-items: center; justify-content: flex-end; padding: 5px; background: #2c2c2c; flex: none; position: relative; }
.afb-type { font-size: 12px; color: #888; padding: 4px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 4px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.afb-type:hover, .afb-type.open { background: #383838; color: #fff; }
.afb-type.on { color: #027dff; }
.afb-name { position: relative; width: 181px; height: 27px; margin-left: 9.6px; border-radius: 3px; background: #383838; display: flex; align-items: center; }
.afb-name .la-search { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); color: #757575; }
.afb-name input { width: 100%; height: 100%; padding: 0 28px; border: 0; background: transparent; color: #fff; font: 11.2px var(--ui); outline: none; }
.afb-name input::placeholder { color: #757575; }
.afb-name .clr { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: #fff; padding: 0; font-size: 12px; }
.afb-name.on .la-search { color: #fff; }
.afb-pop { position: absolute; top: 34px; left: 64px; width: 233px; max-height: 60vh; overflow-y: auto; background: #fff; color: #000; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.1); padding: 13px 16px; z-index: 30; font-size: 14px; line-height: 21px; }
.afb-pop .gh { margin: 9.6px 0 3.2px; font-size: 11.2px; font-weight: 600; color: #757575; text-transform: uppercase; line-height: 16.8px; }
.afb-pop label { display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
.afb-pop input { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin: 0; border: 1px solid #adb5bd; border-radius: 50%; background: #fff; flex: none; position: relative; }
.afb-pop input:checked { background: #007bff; border-color: #007bff; }
.afb-pop input:checked:after { content: ""; position: absolute; left: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.layers { overflow-y: auto; flex: 0 1 auto; }
.lrow { position: relative; display: flex; height: 36px; background: #535353; color: #eee; border-bottom: 1px solid #333; font-size: 12.6px; cursor: pointer; user-select: none; }
.lrow .c { flex: 0 0 30px; display: flex; align-items: center; justify-content: center; box-shadow: 1px 0 rgba(0,0,0,.3); color: #eee; }
.lrow .c.lk { color: #8f8f8f; }
.lrow.locked .c.lk { color: #eee; }
.lrow.hid .c.ey { color: #8f8f8f; }
.lrow .nm { flex: 1 1 100%; display: flex; align-items: center; padding: 0 8px; min-width: 0; overflow: hidden; }
.lrow.hid .nm { opacity: .3; }
.lrow.kid .nm { background: #464646; }
.lrow.sel .nm { background: #777; color: #fff; }
.lrow .th { width: 28px; height: 28px; margin-right: 8px; display: flex; align-items: center; justify-content: center; flex: none; }
.lrow .th svg { width: 20px; height: 20px; fill: #fff; }
.lrow .th .las { font-size: 20px; }
.lrow .th img { width: 28px; height: 28px; object-fit: contain; border-radius: 3px; background-color: #fff; background-image: linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%); background-size: 8px 8px; background-position: 0 0,4px 4px; }
.lrow .rn { height: 26px; flex: 1; min-width: 0; margin-right: 60px; border: 1px solid #ced4da; border-radius: 3px; padding: 0 6px; font: 11.97px var(--ui); color: #495057; }
.lrow .nm span { font-size: 11.97px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 75%; }
.lrow.grp .nm span { font-weight: 700; }
/* portal group row: a ▸/▾ toggle in the thumbnail slot (no folder icon); members indented 1.5rem (SortableLayerItem bodyIndentStyle) */
.lrow .th.fold { width: auto; min-width: 16px; height: 100%; justify-content: flex-start; padding: 4px 0; }
.lrow .th.fold .las { font-size: inherit; }
.lrow.kid .nm { padding-left: 32px; }
.lrow .pz { font-size: 10px; background: #1d3fb8; color: #fff; padding: 0 6px; border-radius: 9px; margin-left: 6px; flex: none; }
.lrow .acts { position: absolute; right: 0; top: 0; height: 100%; display: flex; align-items: center; padding: 0 3.2px; background: #535353; opacity: 0; transition: opacity .2s; }
.lrow:hover .acts, .lrow.sel .acts { opacity: 1; }
.lrow.locked .acts { display: none; }
.lrow .acts button { border: 0; background: transparent; color: inherit; padding: 0 4px; height: 19px; opacity: .6; font-size: 12.6px; transition: opacity .2s; }
.lrow .acts button:hover { opacity: 1; }
.lempty { font-size: 11.2px; text-align: center; padding: 4px 8px; color: #aeaeae; background: #464646; border-bottom: 1px solid #333; }
.lghost { height: 4px; border: 1px solid #00bcd4; }
.lrow.dragging { opacity: .4; }
.addrow { display: flex; justify-content: center; gap: 4px; padding: 8px; background: #464646; position: relative; flex: none; }
.btn-sm { font-size: 14px; line-height: 21px; padding: 4px 9px; border-radius: 3.2px; display: inline-flex; align-items: center; gap: 4px; }
.btn-sm.primary { background: var(--primary); border: 1px solid var(--primary); color: #fff; }
.btn-sm.outline { background: #fff; border: 1px solid #fff; color: var(--primary); }
.btn-sm.outline.open { background: #ddd; border-color: #ddd; }
/* Import dropdown — portal (12/10): 203 wide, 1px #ddd, radius 6, items 31px 14px #212529, arrow on top */
.dropdown { position: absolute; top: 45px; left: 72px; width: 203px; background: #fff; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.1); padding: 12px 0; z-index: 30; }
.dropdown:before, .dropdown:after { content: ""; position: absolute; left: 152px; border: 6px solid transparent; }
.dropdown:before { top: -13px; border-bottom-color: #ddd; }
.dropdown:after { top: -12px; border-bottom-color: #fff; }
.dropdown button { display: flex; width: 100%; height: 31px; border: 0; background: none; text-align: left; padding: 5px 15px; font-size: 14px; line-height: 21px; color: #212529; gap: 4px; align-items: center; white-space: nowrap; }
.dropdown button:hover { background: #f8f9fa; }
.dropdown button svg { width: 16px; height: 16px; flex: none; }

/* layer settings (left) */
.lset-head { height: 40px; background: #464646; border-bottom: 1px solid #3a3a3a; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; font-weight: 700; font-size: 14px; text-align: center; }
.acc { }
/* section headers: 40px, 12.6px/600, #131313 when open, #2d2d2d when closed, 2px apart (portal 12/10) */
.acc-h { height: 40px; background: #2d2d2d; box-shadow: 0 1px rgba(0,0,0,.3); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.6px; font-weight: 600; cursor: pointer; user-select: none; margin-bottom: 2px; }
.acc-h.on { background: #131313; margin-bottom: 0; }
.acc-h .ar { margin-left: auto; font-size: 12.6px; color: #fff; }
.acc-h .sico { width: 15px; font-size: 15.12px; flex: none; }   /* portal .layer-panel__icon 1.2em */
.acc-h .sico + * { }
.acc-b { padding: 16px 12px 24px; background: var(--panel); margin-bottom: 2px; }
.acc-b label.t { display: block; font-weight: 600; font-size: 14px; line-height: 21px; margin-bottom: 6px; }
.acc-b .inp { font-size: 16px; }
.acc-b .inp.ta { padding: 6px 12px; line-height: 24px; }
.acc-b .field { margin-top: 24px; }
.acc-b .field + .ro-row, .acc-b .fdiv + .ro-row { margin-top: 12px; }
.cond { padding-bottom: 52px; }
.qh { font-size: 14px; vertical-align: -1px; margin-left: 3px; }
.lset-scroll { overflow-y: auto; min-height: 0; flex: 1; }
.acc-b .gap { height: 12px; }
.ro-row { display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 45px; cursor: pointer; user-select: none; }
/* toggle — portal vue-js-switch: background-color .3s, knob transform 300ms (12/10) */
.sw { background: #bfcbd9; transition: background-color .3s; }
.sw:after { transition: transform .3s; }
.sw.on { background: #3366ff; }   /* portal field toggle: color "#3366FF" (12/10) */
.sw.on:after { transform: translateX(20px); }
.js-ro { cursor: pointer; }
.req { color: #dc3545; }
.ferr { margin: 8px 0 0; font-size: 12.635px; line-height: 18.95px; color: #dc3545; }
.rcard .inp.bad { border-color: #dc3545; }
.instr { margin: 8px 0 0; font-size: 12.635px; font-style: italic; color: #767676; line-height: 18.95px; white-space: pre-line; }  /* portal .tee-upload-instruction */
.rcard .inp::placeholder { color: #757575; }
.ro-row.dim .sw { opacity: .45; }
.fdesc { margin: 0 0 4px; font-size: 12.8px; color: #767676; line-height: 1.5; }
.fsub { margin: -4px 0 12px; }
.fsub label.t { font-size: 14px; }
.fwarn { margin: 6px 0 0; font-size: 80%; font-style: italic; color: #ffc107; }
.inp-g { display: flex; }
.inp-g span { height: 40px; display: flex; align-items: center; padding: 0 12px; background: #e9ecef; border: 1px solid #ced4da; border-right: 0; border-radius: 3px 0 0 3px; color: #495057; font-size: 16px; }
.inp-g .inp { border-radius: 0 3px 3px 0; }
select.inp { padding: 6px 8px; }
.fdesc.tog { padding-left: 50px; margin-top: -10px; }
.ro-link2 { font-size: 12.8px; color: #007bff; cursor: pointer; }
.ro-row + .field { margin-top: 14px; }   /* portal: 26px from a toggle to the next heading */
.ro-link + .field { margin-top: 16px; }
.ro-link { width: max-content; margin: 17px 0 0 auto; font-size: 14px; text-decoration: underline; cursor: pointer; }
.inp[readonly].js-ro { background: #fff; cursor: pointer; }
.inp.num { width: 200px; }
.inp.ta { height: 86px; padding: 6px 12px; resize: vertical; display: block; }
.fdiv { border-top: 1px dashed #bbb; margin: 24px 0 8px; }
.cond { padding: 4px 3px 23px; }
.cond.xcond { padding: 0; }   /* Extra block: same lock as Conditional, no room for an Add button */
.nocond { color: #6c757d; font-size: 14px; margin: 32px 0 14px; }
.btn-xs-sec { display: inline-block; background: #6c757d; border: 1px solid #6c757d; color: #fff; font-size: 12px; padding: 1.6px 8px; border-radius: 3.2px; cursor: pointer; }
.tico { font-size: 13px; font-weight: 600; width: 14px; text-align: center; }
.acc-b .radio { margin: 0; line-height: 21px; gap: 8px; }
.acc-b .radio input { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; margin: 0; border: 1px solid #adb5bd; border-radius: 50%; background: #fff; flex: none; position: relative; }
.acc-b .radio input:checked { background: #007bff; border-color: #007bff; }
.acc-b .radio input:checked:after { content: ""; position: absolute; left: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.acc-b label.t + .radio { margin-top: 2px; }
.acc-b .radio.dis { opacity: .45; cursor: not-allowed; }
.fx-wrap { background: #343a40; padding: 12px 0; cursor: pointer; }
.fx-wrap.fx-empty { cursor: default; }   /* a new image layer: the effect list can be browsed, picking one shows the install note */
.fx-tree { position: relative; flex: 1; }
.fx-pick { justify-content: space-between; cursor: pointer; color: #757575; }

/* inputs — measured from the real editor (12/10): Bootstrap form-control 16px/24px #495057, placeholder #6c757d */
.inp { width: 100%; height: 40px; border: 1px solid #ced4da; border-radius: 3px; padding: 6px 12px; font-family: var(--ui); font-size: 16px; font-weight: 400; line-height: 24px; color: #495057; background: #fff; }

.radio { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 6px 0; cursor: pointer; }

.radio.locked { color: #c9c9c9; }
.hint-txt { font-size: 12.5px; color: #cfcfcf; margin: 12px 0 0; line-height: 1.45; }

/* centre */

/* toolbar — rebuilt from the real editor screenshot (09/10): items 13-14px, separators full-height, carets grey */

/* foldable groups must lay out like the bar, or their separators collapse to 0px (QA 13/10) */
.toolbar .ovf, .toolbar .ovf-more { display: inline-flex; align-items: center; flex: none; }
#tbUndo, #tbRedo { min-width: 29px; }
.tb-gap { width: 11px; flex: none; }
.tb-i { border: 0; background: none; color: #eee; height: 30px; min-width: 24px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: inherit; font-size: 13.3px; border-radius: 3px; flex: none; }

.tbsvg { width: 20px; height: 20px; display: block; }

.tb-i .pe { font-size: 13.3px; }
.tb-i.on { background: rgba(255,255,255,.14); }
.tb-zoom { display: inline-flex; align-items: center; gap: 4px; font: 11.3px var(--ui); color: #fff; padding: 0 4px; height: 30px; border: 0; background: none; border-radius: 3px; flex: none; }

.qp-list { min-width: 120px; padding: 4px 0; }
.qp-list button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 5px 14px; font-size: 13.3px; color: #212529; }
.qp-list button:hover, .qp-list button.on { background: #f1f3f5; }
.qp-list hr { border: 0; border-top: 1px solid #e9ecef; margin: 4px 0; }
.qp-sw { display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer; white-space: nowrap; }
.qp-sw .sw { width: 34px; }
.qp-sw .sw.on:after { transform: translateX(14px); }
.qp-sw .sw.on { background: #4cc249; }   /* portal EditorSetting toggles: color #4cc249 */
.tb-zoom .la { font-size: 11.3px; }
.caret { color: #a9a9a9; font-size: 12px !important; }
.tb-dd { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px; cursor: pointer; flex: none; }
.tb-dd b { font-weight: 600; color: #eee; font-size: 13.3px; }
.tb-dd small { font-size: 11.64px; color: #eee; }
.tb-dd select { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 14px; }
.tb-size { display: inline-flex; align-items: center; width: 57px; justify-content: space-between; position: relative; flex: none; }
.tb-size input { width: 50px; background: transparent; border: 0; color: #eee; font: inherit; font-weight: 600; font-size: 11.97px; padding: 0; -moz-appearance: textfield; }
.tb-size input::-webkit-outer-spin-button, .tb-size input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.tb-size select { position: absolute; right: 0; top: 0; width: 22px; height: 30px; opacity: 0; cursor: pointer; }
.tb-color { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px; cursor: pointer; flex: none; }
.tb-color .a { position: relative; line-height: 1; padding-bottom: 4px; color: #eee; }
.tb-color .a .las { font-size: 17.6px; }
.tb-color .a .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.tb-color input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.tb-stroke { font-size: 20px; font-weight: 400; color: #3d9bff; }
.tb-hatch { width: 18px; height: 18px; background: repeating-linear-gradient(135deg, #ddd 0 2px, transparent 2px 5px); clip-path: polygon(30% 0,100% 0,100% 70%,70% 100%,0 100%,0 30%); }
.board.grid::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4;
  background-image: linear-gradient(to right, rgba(0,0,0,.28) 2px, transparent 2px), linear-gradient(to bottom, rgba(0,0,0,.28) 2px, transparent 2px); background-size: 200px 200px; }
.stage { background: var(--stage); position: relative; overflow: hidden; }
.stage .sizer { position: absolute; left: 0; top: 0; pointer-events: none; }
.board { position: absolute; left: 0; top: 0; width: 1600px; height: 1600px; transform-origin: 0 0;
  background-color: #fff; background-image: linear-gradient(45deg,#e3e3e3 25%,transparent 25%),linear-gradient(-45deg,#e3e3e3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e3e3e3 75%),linear-gradient(-45deg,transparent 75%,#e3e3e3 75%);
  background-size: 28px 28px; background-position: 0 0,0 14px,14px -14px,-14px 0; }
.obj { position: absolute; cursor: move; user-select: none; touch-action: none; }
.obj.text { white-space: pre; line-height: 1.18; display: flex; align-items: center; justify-content: center; }
.obj.image img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
.obj.hidden { display: none; }
.obj.locked { pointer-events: none; }
.inplace { position: absolute; z-index: 8; border: 0; outline: calc(2px * var(--inv, 2)) solid #00c4cc; background: rgba(255,255,255,.6); resize: none; padding: 0; overflow: hidden; white-space: nowrap; }
/* hover outline, from the portal: .artwork-object:hover { box-shadow: 0 0 0 2px #00c4cc inset } — also shown when hovering the layer's row */
.sbx:not(.live) .obj:hover, .obj.hov { box-shadow: inset 0 0 0 calc(2px * var(--inv, 2)) #00c4cc; }
.live .obj { cursor: default; }
/* selection frame — measured from the real editor (drr, 12/10): 2px #00c4cc, 14px white dots in 22px hit areas, rotate stick 37px above */
.selbox { position: absolute; z-index: 5; pointer-events: none; --u: calc(1px * var(--inv, 2)); }
.selbox:before { content: ""; position: absolute; inset: 0; border: calc(2 * var(--u)) solid #00c4cc; }
.selbox.one:before { border-width: var(--u); }
.selbox.inactive:before { border-style: dashed; }   /* portal .drr--inactive: dashed, no handles */
.selbox.inactive .hd, .selbox.inactive .ro-line { display: none; }
.selbox.all:before { border-style: dashed; }
.selbox .ax-x { position: absolute; left: 50%; top: 0; bottom: 0; border-left: var(--u) dotted #00c4cc; }
.selbox .ax-y { position: absolute; top: 50%; left: 0; right: 0; border-top: var(--u) dotted #00c4cc; }
.selbox b { position: absolute; left: 50%; top: calc(100% + 3 * var(--u)); transform: translateX(-50%); background: #00c4cc; color: #fff; font: 400 calc(12.6 * var(--u)) var(--ui); padding: 0 calc(3 * var(--u)); white-space: nowrap; }
.selbox .hd { position: absolute; width: calc(22 * var(--u)); height: calc(22 * var(--u)); margin: calc(-11 * var(--u)) 0 0 calc(-11 * var(--u)); pointer-events: auto; }
.selbox .hd:before { content: ""; position: absolute; left: calc(4 * var(--u)); top: calc(4 * var(--u)); width: calc(14 * var(--u)); height: calc(14 * var(--u)); border-radius: 50%; background: #fff; box-shadow: 0 0 calc(5 * var(--u)) var(--u) rgba(57,76,96,.15), 0 0 0 var(--u) rgba(53,71,90,.2); }
.selbox .tl { left: 0; top: 0; cursor: nwse-resize; } .selbox .tr { left: 100%; top: 0; cursor: nesw-resize; }
.selbox .br { left: 100%; top: 100%; cursor: nwse-resize; } .selbox .bl { left: 0; top: 100%; cursor: nesw-resize; }
.selbox .ml { left: 0; top: 50%; cursor: ew-resize; } .selbox .mr { left: 100%; top: 50%; cursor: ew-resize; }
.selbox .ro { left: 50%; top: calc(-26 * var(--u)); cursor: grab; }
/* portal: a small "0deg" tag beside the rotate knob while it is hovered or dragged */
.selbox b.deg { top: calc(-14 * var(--u)); left: calc(50% + 20 * var(--u)); transform: none; background: #333; display: none; }
.selbox:has(.ro:hover) b.deg, .selbox.turning b.deg { display: block; }
.selbox .ro:before { left: 0; top: 0; width: calc(22 * var(--u)); height: calc(22 * var(--u)); background: #fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Cpath fill='currentColor' d='M15.25 18.48V15a.75.75 0 1 0-1.5 0v4c0 .97.78 1.75 1.75 1.75h4a.75.75 0 1 0 0-1.5h-2.6a8.75 8.75 0 0 0-2.07-15.53.75.75 0 1 0-.49 1.42 7.25 7.25 0 0 1 .91 13.34zM8.75 5.52V9a.75.75 0 0 0 1.5 0V5c0-.97-.78-1.75-1.75-1.75h-4a.75.75 0 0 0 0 1.5h2.6a8.75 8.75 0 0 0 2.18 15.57.75.75 0 0 0 .47-1.43 7.25 7.25 0 0 1-1-13.37z'/%3E%3C/svg%3E") center / calc(16 * var(--u)) no-repeat; }
.selbox .ro-line { position: absolute; left: 50%; top: calc(-15 * var(--u)); height: calc(15 * var(--u)); width: calc(2 * var(--u)); margin-left: calc(-1 * var(--u)); background: #00c4cc; }

/* right panel — measured from the portal (12/10) */
.right { position: relative; background: #fff; overflow-y: auto; box-shadow: 0 0 8px rgba(0,0,0,.3); z-index: 2; }
.rhead { display: flex; align-items: flex-end; padding: 16px 8px 0; white-space: nowrap; }
.rhead b { font-size: 14px; font-weight: 700; color: #000; line-height: 29px; margin-right: 8px; }
.rhead .tab { border: 0; background: none; font: 400 14px/21px var(--ui); color: #6c757d; height: 31px; padding: 0 12px; border-bottom: 2px solid transparent; }
.rhead .tab.on { color: #212529; font-weight: 700; border-color: var(--primary); }
.rnote { font-size: 12.25px; line-height: 18.375px; font-style: italic; color: #6c757d; padding: 11.5px 16px 0; }
.rreload { text-align: right; padding: 16px 16px 0; }
.rcard { background: var(--card); margin: 15px 8px 16px; padding: 16px 15px 20px; }
.rcard .lbl { font-size: 12.635px; font-weight: 600; line-height: 17.69px; color: #000; margin: 0 0 9px; }
.rcard .f + .f { margin-top: 22px; }
/* customer form inputs (right panel) — portal .tee__input: 44px, 12.635px/18.95px, padding 7px 15px, #d6d6d6, radius 6px, black */
.rcard .inp { height: 44px; font-size: 12.635px; line-height: 18.95px; padding: 7px 15px; border-color: #d6d6d6; border-radius: 6px; color: #000; }
.inpw { position: relative; }
.rcard .inp.lim { padding-right: 50px; }
.inpw .cnt { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); opacity: .4; font-size: 12.635px; color: #000; pointer-events: none; }
.photo-box { width: 150px; height: 150px; border: 2px dashed #d6d6d6; border-radius: 3px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 40px; background: #fff; overflow: hidden; }
.photo-box .las { opacity: .4; }
.photo-box img { width: 100%; height: 100%; object-fit: cover; }
.btn-blue { background: #1350de; border: 0; color: #fff; font-size: 12.635px; line-height: 15.79px; height: 40px; padding: 0 12.6px; border-radius: 6px; margin-top: 15px; }
.rcard .lbl { display: flex; align-items: center; justify-content: space-between; }
.fedit { border: 1px solid #d6d6d6; background: #e9ecef; color: #212529; width: 22px; height: 23.2px; border-radius: 3.2px; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.reload { border: 1px solid var(--primary); background: #fff; color: var(--primary); font-size: 12px; line-height: 18px; padding: 2px 4px; border-radius: 3.2px; }
.ro-list { margin: 44px 16px 16px; border: 1px solid #d6d6d6; background: #fff; }
.atl { display: flex; align-items: center; height: 48px; padding: 0 5px 0 10px; background: #d6d6d6; cursor: move; }
.atl + .atl { margin-top: 1px; }
.atl.dragging { opacity: .5; }
.atl-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.atl-t .t1 { font-size: 14px; line-height: 21px; color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: -4px; }

.atl-t small { font-size: 12.25px; line-height: 18.375px; color: #6c757d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atl-e { border: 0; background: none; width: 24px; height: 32px; padding: 4px; font-size: 16px; color: #212529; border-radius: 3px; }
.atl-h { font-size: 14px; color: #000; margin-left: 2px; width: 14px; }
.pvopt { position: absolute; left: calc(100% - var(--right-w) - 27px); top: max(calc(var(--bb-h) + 90px), min(calc(var(--bb-h) + 420px), calc(100% - 160px)));   /* 15/10: stays inside short frames (tablets) */ width: 27px; height: 137px; background: #fff; border-radius: 7px 7px 0 0; box-shadow: 0 0 8px rgba(0,0,0,.3); border: 0; padding: 0; color: #0d268f; font: 12.6px/18.9px var(--ui); display: flex; align-items: center; justify-content: center; z-index: 3; }
.pvopt span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.pvopt .las { transform: rotate(90deg); }
.empty { font-size: 13.5px; color: #666; line-height: 1.6; }
.empty b { color: #212529; }

.gd-ring { position: fixed; z-index: 70; pointer-events: none; border: 2px solid #1f5ce6; border-radius: 5px; animation: gdpulse 1.6s ease-out infinite; }
@keyframes gdpulse { 0% { box-shadow: 0 0 0 0 rgba(31,92,230,.55); } 70% { box-shadow: 0 0 0 9px rgba(31,92,230,0); } 100% { box-shadow: 0 0 0 0 rgba(31,92,230,0); } }
.gd-tip { position: fixed; z-index: 71; width: 250px; background: #1f5ce6; color: #fff; border-radius: 8px; padding: 12px 14px 10px; box-shadow: 0 6px 22px rgba(0,0,0,.3); font-size: 13.5px; line-height: 1.45; }
.gd-tip:before { content: ""; position: absolute; border: 7px solid transparent; }
.gd-tip[data-side=l]:before { left: -14px; top: calc(var(--ay) - 7px); border-right-color: #1f5ce6; }
.gd-tip[data-side=r]:before { right: -14px; top: calc(var(--ay) - 7px); border-left-color: #1f5ce6; }
.gd-tip[data-side=t]:before { top: -14px; left: calc(var(--ax) - 7px); border-bottom-color: #1f5ce6; }
.gd-tip .gd-step { font-size: 11.5px; opacity: .8; margin-bottom: 2px; }
.gd-tip b { font-size: 14.5px; }
.gd-tip p { margin: 3px 0 8px; }
.gd-foot { display: flex; justify-content: space-between; }
.gd-foot button { border: 0; background: none; color: #fff; font-size: 12.5px; padding: 2px 0; opacity: .85; }
.gd-foot .gd-skip { background: #fff; color: #1f5ce6; opacity: 1; font-weight: 600; padding: 3px 10px; border-radius: 4px; }
.gd-min { position: absolute; left: 12px; bottom: 12px; z-index: 6; border: 0; background: #fff; color: #212529; border-radius: 18px; padding: 7px 14px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
/* tips card */
.tips { margin: auto 12px 12px; background: #fff; color: #212529; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); padding: 14px 16px 12px; }
.right .tips { margin: 8px 8px 16px; box-shadow: none; border: 1px solid #e3e3e3; }
.tips h4 { margin: 0 0 8px; font-size: 14.5px; display: flex; align-items: center; }
.tips h4 .x { margin-left: auto; border: 0; background: none; color: #999; font-size: 16px; }
.tips ol { list-style: none; margin: 0; padding: 0; }
.tips li { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; line-height: 1.4; padding: 5px 0; color: #333; }
.tips li .ck { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c5cbe0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; margin-top: 1px; }
.tips li.done { color: #9a9a9a; text-decoration: line-through; }

.tips li small { display: block; color: #888; text-decoration: none; font-size: 12px; }

.right .tips-min { margin: 8px; }

/* finish card */
.finish { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: 400px; max-width: calc(100% - 32px); background: #fff; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.45); padding: 26px 26px 20px; z-index: 40; text-align: center; }
.finish h3 { margin: 0 0 8px; font-size: 19px; }
.finish p { margin: 0 0 18px; font-size: 14px; color: #555; line-height: 1.55; }
.finish .sub { display: block; margin-top: 12px; font-size: 13px; color: #1f5ce6; }
.finish .close { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 18px; color: #999; }

/* tooltips — the portal's floating-vue tooltip (12/10): rgba(0,0,0,.9), 14px/21px, padding 7px 12px 6px, radius 6, max 320 */
.tt { position: fixed; z-index: 95; max-width: 320px; background: rgba(0,0,0,.9); color: #fff; font: 400 14px/21px var(--ui); padding: 7px 12px 6px; border-radius: 6px; pointer-events: none; }
.tt:after { content: ""; position: absolute; left: var(--ax, 50%); margin-left: -5px; border: 5px solid transparent; }
.tt[data-side=t]:after { top: 100%; border-top-color: rgba(0,0,0,.9); }
.tt[data-side=b]:after { bottom: 100%; border-bottom-color: rgba(0,0,0,.9); }
.tt.img { max-width: 420px; }
.tt img { display: block; width: 100%; height: auto; border-radius: 3px; }
.tt img + span { display: block; margin-top: 6px; }
.qh { cursor: help; }

/* first-visit product tour — Phượng chose style A (12/10): dim everything except the area being explained, white card */
.tour-dim { position: fixed; inset: 0; z-index: 90; pointer-events: none; }   /* clicks outside the ring are stopped in script, so the ring itself stays clickable */
.tour-hole { position: fixed; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(15,20,40,.55); pointer-events: none; transition: all .25s ease; }
.tour-hole.none { box-shadow: 0 0 0 9999px rgba(15,20,40,.55); width: 0 !important; height: 0 !important; }
.tour-card { position: fixed; z-index: 91; width: 300px; background: #fff; color: #212529; border-radius: 10px; padding: 16px 16px 12px; box-shadow: 0 12px 36px rgba(0,0,0,.3); font-size: 13.5px; transition: left .25s ease, top .25s ease; }
.tour-card .step { font-size: 11.5px; font-weight: 600; color: #1350de; letter-spacing: .04em; text-transform: uppercase; }
.tour-card h6 { margin: 6px 0; font-size: 16px; font-weight: 600; }
.tour-card p { margin: 0; line-height: 1.5; color: #444; }
.tour-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.tour-dots { display: flex; gap: 5px; margin-right: auto; }
.tour-dots i { width: 6px; height: 6px; border-radius: 50%; background: #d0d7e5; transition: width .2s; }
.tour-dots i.on { background: #1350de; width: 16px; border-radius: 3px; }
.tour-card button, .tour-card a.t-btn { border: 0; background: none; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; flex: none; }
.tour-card button:focus { outline: none; }
.tour-card button:focus-visible, .tour-card a.t-btn:focus-visible { outline: 2px solid #8aa2ff; outline-offset: 2px; }
.tour-card.last { width: 340px; }
.tour-foot { flex-wrap: nowrap; }
.tour-card .t-skip { color: #6c757d; padding: 6px 2px; }
.tour-card .t-next, .tour-card a.t-next { background: #1350de; color: #fff; font-weight: 600; padding: 7px 14px; border-radius: 6px; }
.tour-card .t-next:hover, .tour-card a.t-next:hover { background: #0d25bf; }
.tour-card .t-ghost { color: #1350de; font-weight: 600; padding: 7px 4px; }
.tour-card:before { content: ""; position: absolute; border: 7px solid transparent; }
.tour-card[data-side=r]:before { left: -7px; top: 24px; border-left: 0; border-right-color: #fff; }
.tour-card[data-side=l]:before { right: -7px; top: 24px; border-right: 0; border-left-color: #fff; }
.tour-card[data-side=b]:before { top: -7px; left: var(--ax, 30px); border-top: 0; border-bottom-color: #fff; }
.tour-card[data-side=t]:before { bottom: -7px; left: var(--ax, 30px); border-bottom: 0; border-top-color: #fff; }
.tour-card[data-side=r]:before, .tour-card[data-side=l]:before { top: var(--ay, 24px); }
/* the mock browser bar stays bright and clickable during the tour (Phượng 13/10): the dim layer is cut off below it */
.tour-dim { clip-path: inset(var(--bb-h) 0 0 0); }
.tour-card[data-side=c]:before { display: none; }
.tour-again { position: absolute; left: 12px; bottom: 12px; z-index: 6; border: 0; background: #fff; color: #212529; border-radius: 16px; padding: 6px 13px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.3); display: inline-flex; align-items: center; gap: 5px; }
.tour-again .las { font-size: 15px; color: #1350de; }
.tour-again[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .tour-hole, .tour-card, .tour-dots i { transition: none; } }
/* tour: the explained area gets a pulsing blue ring, not only a lighter patch (Phượng 13/10) */
.tour-hole { box-shadow: 0 0 0 9999px rgba(15,20,40,.62); }
.tour-hole:after { content: ""; position: absolute; inset: 0; border: 2.5px solid #3d8bff; border-radius: inherit; box-shadow: 0 0 0 4px rgba(61,139,255,.35), inset 0 0 0 1px rgba(255,255,255,.35); animation: tourring 1.6s ease-in-out infinite; }
.tour-hole.none:after, .tour-hole[style*="width: 0px"]:after { display: none; }
@keyframes tourring { 0%,100% { box-shadow: 0 0 0 3px rgba(61,139,255,.45), inset 0 0 0 1px rgba(255,255,255,.35); } 50% { box-shadow: 0 0 0 9px rgba(61,139,255,0), inset 0 0 0 1px rgba(255,255,255,.35); } }
@media (prefers-reduced-motion: reduce) { .tour-hole:after { animation: none; } }
/* 02/11 Phượng: until the visitor clicks anything, the ring pulses harder (wider, brighter, faster) to invite a click; the card pops in */
.tour-card.pop-in { animation: tourpop .35s cubic-bezier(.2,.9,.3,1.2); }
@keyframes tourpop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
/* step 1 opens with a welcome (Phượng 02/11): big line, intro under it, a gap, then the step */
.tour-card.welcome { width: 330px; padding-top: 20px; }
.tour-card .t-welcome { margin: 0 0 8px; color: #111827; font-family: Dosis, sans-serif; font-size: 22px; font-weight: 700; line-height: 1.2; }
.tour-card .t-intro { margin: 0 0 16px; padding-bottom: 16px; border-bottom: 1px solid #e6e9f0; font-size: 14px; }
/* until the first real click: two light streaks run round the ring from opposite corners, AI-style (Phượng 02/11) */
.tour-run { display: none; position: absolute; inset: 0; overflow: visible; filter: drop-shadow(0 0 4px #5aa0ff) drop-shadow(0 0 10px rgba(61,139,255,.7)); }
.tour-run svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tour-run rect { fill: none; stroke-linecap: round; animation: tourrun var(--run-t, 4.5s) linear infinite; }
.tour-run .tail { stroke: #3d8bff; stroke-width: 2.5; }
.tour-run .head { stroke: #fff; stroke-width: 2.5; }   /* same width and line as the blue ring (border 2.5px), so the light sits on it */
/* the streaks run along the edge at the same speed on every step (02/11: angle-based light raced along the wide toolbar) */
@keyframes tourrun { from { stroke-dashoffset: var(--o0); } to { stroke-dashoffset: var(--o1); } }
.tour-hole.strong .tour-run { display: block; }
.tour-hole.strong:after { animation: none; box-shadow: 0 0 0 3px rgba(61,139,255,.3), inset 0 0 0 1px rgba(255,255,255,.35); border-color: rgba(61,139,255,.55); }
.tour-hole[style*="width: 0px"] .tour-run { display: none; }
/* a click the tour blocks gives the card a small shake */
.tour-card.nudge { animation: tournudge .4s ease; }
@keyframes tournudge { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .tour-run rect, .tour-card.pop-in, .tour-card.nudge { animation: none; } }
/* start + finish cards = the live homepage tour (tib-guide__popup-card), Phượng 13/10 */
.tour-card.live-pop { width: 450px; max-width: calc(100% - 28px); padding: 25px 15px; border: 1px solid rgba(17,24,39,.08); border-radius: 12px; box-shadow: 0 18px 50px #1118272e; text-align: center; }
.tour-card.live-pop:before { display: none; }
.tour-card.live-pop h6 { margin: 0 0 10px; color: #111827; font-family: Dosis, sans-serif; font-size: 25px; font-weight: 700; line-height: 1.2; }
.tour-card.live-pop p { color: #555f70; font-family: Lato, sans-serif; font-size: 15px; line-height: 1.45; }
.tour-card.live-pop .lp-actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
.tour-card.live-pop .lp-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px 18px; border: 1px solid transparent; border-radius: 8px; background: #3156e8; color: #fff; font-family: Lato, sans-serif; font-size: 16px; font-weight: 400; line-height: 1.2; text-decoration: none; cursor: pointer; }
.tour-card.live-pop .lp-btn:hover { background: #2445c9; }
.tour-card.live-pop .lp-x { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: #9aa3b2; font-size: 18px; padding: 4px; }
.snapg { position: absolute; z-index: 7; pointer-events: none; background: #ff4aff; }   /* portal .drawing-snapper-x/y: 1px #ff4aff */
.snapg.v { top: 0; bottom: 0; }
.snapg.h { left: 0; right: 0; }   /* thickness set in drawGuides: always 1 screen px */
/* features outside the sandbox: a little greyed, still clickable (Phượng 13/10). Remove class grey-locked on body to compare with the portal look */
.grey-locked .lt.off .lt-m, .grey-locked .lt.off .lt-ar { opacity: .6; }
.grey-locked .dropdown button.off { opacity: .6; }
.grey-locked .toolbar .tb-i.off, .grey-locked .toolbar .hd-btn.off { opacity: .55; }
.grey-locked .lt.off:hover .lt-m, .grey-locked .dropdown button.off:hover, .grey-locked .toolbar .tb-i.off:hover { opacity: .85; }
/* layer type modal — measured from the portal (12/10): 950 wide at top 90, 3-column grid, search box, expandable rows */
.overlay { position: absolute; inset: 0; background: rgba(0,0,0,.2); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding-top: calc(var(--bb-h) + 90px); }
.modal { background: #fff; width: min(950px, calc(100% - 40px)); height: min(80vh, calc(100% - var(--bb-h) - 110px)); border-radius: 3px; display: flex; flex-direction: column; box-shadow: 0 20px 60px -2px rgba(27,33,58,.4); }
.modal-h { display: flex; align-items: center; height: 79px; padding: 16px 20px; border-bottom: 1px solid #e0e0e0; flex: none; }
.modal-h h3 { margin: 0; font-size: 18px; font-weight: 600; color: #343a40; }
.modal-ha { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.lt-search { width: 260px; height: 46px; background: #f5f5f5; border-radius: 6px; padding: 0 14px; display: flex; align-items: center; gap: 12px; cursor: text; }
.lt-search i { font-size: 18px; color: #888; }
.lt-search input { border: 0; background: none; outline: 0; font: 14px var(--ui); color: #212529; width: 100%; padding: 0; }
.lt-search input::placeholder { color: #6c757d; }
.modal-h .x { border: 0; background: none; width: 34px; height: 34px; border-radius: 8px; font-size: 20px; color: #555; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.modal-h .x:hover { background: #f5f5f5; }
.modal-b { overflow-y: auto; padding: 20px 28px 28px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 28px 40px; align-content: start; }
.grp-h { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid #ebebeb; }
.grp-h .dot { width: 6px; height: 6px; border-radius: 50%; background: #6d94ff; flex: none; }
.grp-h h5 { margin: 0; font-size: 12px; font-weight: 600; line-height: 1.2; letter-spacing: .06em; text-transform: uppercase; color: #888; }
.grp-i { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
.lt { display: flex; align-items: center; width: 100%; height: 32px; border: 0; background: none; padding: 4px 6px; color: #222; text-align: left; border-radius: 4px; flex: none; }
.lt:hover { background: #f5f5f5; }
.lt-m { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 15px; line-height: 18.75px; }
.lt svg { width: 24px; height: 24px; flex: none; fill: currentColor; }
.lt-ar { margin-left: auto; font-size: 16px; color: #aaa; }
.lt.ex { background: #d2e1ff; color: #0d268f; }
.lt-kids { margin-left: 12px; padding-left: 16px; border-left: 2px solid #adc8ff; display: flex; flex-direction: column; gap: 8px; }
.lt.kid .lt-m { font-size: 13px; line-height: 16.25px; opacity: .7; }
.lt.kid:not(.off) .lt-m { opacity: 1; font-weight: 600; }   /* a sub-type the sandbox runs (Single Upload) reads as available (Phượng 14/10) */
.lt-none { grid-column: 1 / -1; color: #888; font-size: 14px; margin: 8px 0; }
/* "Artwork details" (pen next to the design name) — copied from the portal dialog-artwork-setup (Phượng's screenshot 14/10, measured at 1x):
   640 wide, padding 16, Name* / Category + "New category" / Artwork size radios / Width, swap, Height / Design format / Save + Cancel centred.
   Only Name works; Category, size and design format keep the portal layout, greyed, and clicking them shows the install card (Phượng 14/10). */
.aw-modal { background: #fff; width: min(640px, calc(100% - 40px)); border-radius: 3px; box-shadow: 0 20px 60px -2px rgba(27,33,58,.4); padding: 16px; color: #343a40; font-size: 14px; line-height: 21px; position: relative; }
.aw-modal h6 { margin: 0 0 16px; font-size: 16px; font-weight: 500; line-height: 19.2px; color: #343a40; }
.aw-row { display: grid; grid-template-columns: 25% 75%; margin: 0 -5px 16px; }   /* Bootstrap form-row + col-md-3 / col-md-9 */
.aw-row > * { padding: 0 5px; min-width: 0; }
.aw-row > label { padding-top: 7px; padding-bottom: 7px; color: #343a40; }
.aw-row .req { color: #dc3545; }
.aw-modal .inp { height: 40px; }
.aw-modal .inp.bad { border-color: #dc3545; }
.aw-row .err { color: #dc3545; font-size: 14px; display: block; }
.aw-row .err:empty { display: none; }
.aw-sel { position: relative; height: 40px; border: 1px solid #ddd; border-radius: 5px; background: #fff; padding: 0 30px 0 12px; display: flex; align-items: center; font-size: 16px; cursor: pointer; color: #333; }
.aw-sel .ph { color: #bdbdbd; }
.aw-newcat { display: flex; justify-content: flex-end; }
.aw-newcat button { border: 0; background: none; font: inherit; color: #212529; padding: 5px 8px; line-height: 21px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.aw-newcat .la-plus { font-size: 14px; }
.aw-head { font-weight: 700; color: #343a40; margin: 0 0 8px; }
.aw-radios { margin-bottom: 16px; }
.aw-radio { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #212529; }
.aw-radio i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #adb5bd; background: #fff; flex: none; }
.aw-radio.on i { border-color: #3579f6; background: #3579f6; box-shadow: inset 0 0 0 5px #3579f6; background-image: radial-gradient(circle, #fff 0 3px, transparent 3.5px); }
.aw-swap { display: flex; justify-content: flex-end; margin: 0 0 4px; }
.aw-swap button { border: 0; background: none; color: #3579f6; font-size: 17px; height: 31px; padding: 0 8px 0 0; cursor: pointer; }
.aw-row.tight { margin-bottom: 4px; }
.aw-ro { cursor: pointer; }
.aw-ro .inp { pointer-events: none; }
.grey-locked .aw-ro, .grey-locked .cond.js-ro { opacity: .5; transition: opacity .15s; }
.grey-locked .cond.js-ro:hover { opacity: .8; }
/* 15/10 Phượng: every locked toggle/link in the layer settings is greyed the same way (Populate Values, reposition, crop shape, Gen AI switches); click → install card */
.grey-locked .lset-scroll .ro-row.js-ro, .grey-locked .lset-scroll .radio.lkr, .grey-locked .lset-scroll .ro-link.js-ro, .grey-locked .lset-scroll .ro-link2.js-ro { opacity: .5; transition: opacity .15s; }
.grey-locked .lset-scroll .ro-row.js-ro:hover, .grey-locked .lset-scroll .radio.lkr:hover, .grey-locked .lset-scroll .ro-link.js-ro:hover, .grey-locked .lset-scroll .ro-link2.js-ro:hover { opacity: .8; }
.cond.js-ro .q, .cond.js-ro .radio { pointer-events: none; }   /* the block takes the click, not the AND/OR radios or their ? tips */   /* locked parts greyed like the other locked features, no lock icon (Phượng 14/10) */
.grey-locked .aw-ro:hover { opacity: .8; }   /* size fields look like the portal's but are fixed here: the row takes the click and shows the install card */
.aw-df { margin: 0 -5px 16px; }
.aw-df .aw-sel { border-color: #e8e8e8; font-size: 14px; color: #35495e; padding-left: 13px; }
.aw-df .aw-sel::after { content: ''; position: absolute; right: 12px; top: 50%; margin-top: -2px; border: 5px solid transparent; border-top-color: #999; border-bottom: 0; }
.aw-foot { display: flex; justify-content: center; gap: 4px; }
.aw-foot .btn-primary, .aw-foot .aw-cancel { font: 14px/21px var(--ui); padding: 4px 8px; border-radius: 3px; cursor: pointer; }
.aw-foot .aw-cancel { border: 1px solid var(--primary); background: #fff; color: var(--primary); }
.aw-foot .aw-cancel:hover { background: var(--primary); color: #fff; }
@media (max-width: 600px) { .aw-row { grid-template-columns: 1fr; } .aw-row > label { padding-top: 0; padding-bottom: 6px; } }

/* "full app feature" card: shown when someone clicks something the sandbox doesn't run */
.pop { position: fixed; z-index: 80; width: 300px; background: #fff; color: #212529; border-radius: 12px; box-shadow: 0 12px 40px rgba(13,38,143,.18), 0 2px 8px rgba(0,0,0,.12); padding: 18px 18px 16px; border-top: 4px solid #1f5ce6; animation: popin .16s ease-out; }
@keyframes popin { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }

.pop h6 { margin: 0 0 6px; font-size: 16px; font-weight: 600; line-height: 1.35; padding-right: 18px; }
.pop p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.5; color: #555; }
.pop p.more { color: #212529; margin-top: 8px; }
.pop-act { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.pop .btn-primary { font-size: 14px; padding: 8px 16px; border-radius: 6px; gap: 6px; }
.pop .sub { font-size: 13px; color: #1f5ce6; text-decoration: none; }
.pop .sub:hover { text-decoration: underline; }
.pop .x { position: absolute; right: 10px; top: 10px; border: 0; background: none; color: #999; font-size: 16px; }

/* toolbar popovers — measured from the real editor (09/10): white, radius 3, shadow 0 0 4px rgba(0,0,0,.15), 13.3px */
.qpop { position: fixed; z-index: 60; background: #fff; color: #212529; border-radius: 3px; box-shadow: 0 0 4px rgba(0,0,0,.15); padding: 8px; font-size: 13.3px; }
.qpop.dark { background: #414141; color: #eee; box-shadow: none; padding: 4px; border-radius: 3px; }
.qp-in { padding: 16px; }
.qp-lbl { font-weight: 600; }
.qp-radio { display: flex; align-items: center; gap: 8px; margin: 4px 0 0; cursor: pointer; }
.qp-in > .qp-lbl + .qp-radio { margin-top: 10px; }
.qp-radio input { width: 16px; height: 16px; margin: 0; accent-color: #1d6bff; }
.qp-row { display: grid; grid-template-columns: 123px 1fr; align-items: start; margin-top: 18px; }
.qp-row .qp-lbl { padding-top: 10px; }

.qp-cflink { display: block; margin-top: 6px; color: #007bff; text-decoration: none; }
.overlay.cfo { padding-top: var(--bb-h); overflow-y: auto; align-items: flex-start; }
.cfw { position: relative; width: min(1000px, calc(100% - 40px)); background: #fff; border-radius: 3px; padding: 16px 24px 16px; margin-top: 8px; color: #343a40; font-size: 14px; }
.cfw-x { position: absolute; right: 0; top: -8px; width: 36px; height: 37px; border: 0; background: none; font-size: 15px; color: #343a40; }

.cfw-box { padding: 8px; }
.cfw-tools { display: flex; align-items: center; gap: 28px; }

  // colour picker: saturation/value square, hue bar, alpha bar, HEX — like the portal's "Solid" tab
  function colorPicker(l, p) {
    p.style.width = '326px';
    const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
    const toHex = (r, g, b) => '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    const rgb2hsv = ([r, g, b]) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
      if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [(h * 60 + 360) % 360, mx ? d / mx : 0, mx]; };
    const hsv2rgb = (h, s, v) => { const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return [f(5) * 255, f(3) * 255, f(1) * 255]; };
    let [H, Sa, V] = rgb2hsv(rgb(l.color)); if (p._hue != null && Sa === 0) H = p._hue;
    const A = l.alpha == null ? 1 : l.alpha;
    p.innerHTML = `<div class="qp-tabs"><button class="on"><span class="sq"></span>Solid</button><button id="cseq"><span class="sq multi"></span>Color Sequence</button></div>
      <div class="qp-note">Apply the same color to all characters.</div>
      <div class="cp-sv" id="sv" style="background:hsl(${H},100%,50%)"><div class="w"></div><div class="b"></div><span class="cp-dot" style="left:${Sa * 100}%;top:${(1 - V) * 100}%"></span></div>
      <div class="cp-row"><i class="las la-eye-dropper" style="font-size:16px;color:#555"></i><span class="cp-sw"><i style="background:${hexToRgba(l.color, A)}"></i></span>
        <div><div class="cp-bar cp-hue" id="hue"><span class="cp-knob" style="left:${H / 360 * 100}%"></span></div>
        <div class="cp-bar cp-alpha" id="alp"><i style="background:linear-gradient(90deg,${hexToRgba(l.color, 0)},${hexToRgba(l.color, 1)})"></i><span class="cp-knob" style="left:${A * 100}%"></span></div></div></div>
      <div class="cp-hex"><input id="hex" value="${l.color}"><i class="las la-sort" style="color:#777"></i><small>HEX</small></div>`;
    const apply = () => { l.color = toHex(...hsv2rgb(H, Sa, V)); p._hue = H; tick('edit'); renderBoard(); renderToolbar(); colorPicker(l, p); };
    const dragOn = (el, fn) => el.onpointerdown = e => { el.setPointerCapture(e.pointerId); const mv = ev => { const r = el.getBoundingClientRect(); fn(Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))); };
      mv(e); el.onpointermove = mv; el.onpointerup = () => { el.onpointermove = null; }; };
    dragOn(p.querySelector('#sv'), (x, y) => { Sa = x; V = 1 - y; apply(); });
    dragOn(p.querySelector('#hue'), x => { H = x * 360; apply(); });
    dragOn(p.querySelector('#alp'), x => { l.alpha = Math.round(x * 100) / 100; tick('edit'); renderBoard(); renderToolbar(); colorPicker(l, p); });
    const hx = p.querySelector('#hex'); hx.onchange = () => { const v = hx.value.trim(); if (/^#?[0-9a-f]{6}$/i.test(v)) { l.color = (v[0] === '#' ? v : '#' + v).toLowerCase(); p._hue = null; changed(); colorPicker(l, p); } };
    p.querySelector('#cseq').onclick = e => lockIt('colorseq', e.currentTarget);
  }

    const at = l => { const i = ord.indexOf(l.id); return i < 0 ? 1e6 + f.indexOf(l) : i; };

  // keep a customer's text inside the layer's rules (limit, numbers only, text case) — the portal applies them to the input itself
  function fitValue(l) {
    if (l.kind !== 'text' || !l.value || l.itype === 'date') return;
    let v = l.value;
    if (l.itype === 'num') v = v.replace(/[^0-9.\-]/g, '');
    const c = l.tcase || 'normal';
    v = c === 'upper' ? v.toUpperCase() : c === 'lower' ? v.toLowerCase() : c === 'cap' ? v.toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()) : v;
    if (l.maxlen) v = v.slice(0, l.maxlen);
    l.value = v;
  }

             <button class="btn-blue js-photo" data-id="${l.id}"${l.genai ? ' data-genai="1"' : ''}>Choose an image</button>${l.err ? `<p class="ferr">${esc(l.err)}</p>` : ''}${l.instr ? `<p class="instr">${esc(l.instr)}</p>` : ''}</div>`).join('') + `</div>`;

    return true;

  // Preview Options tab: slide the form panel out / back in, then refit the design to the new canvas width
  $('#pvopt').onclick = e => {
    e.stopPropagation(); closePop(); closeQPop();
    app.classList.add('pvanim'); app.classList.toggle('pvc');
    let n = 0; const step = () => { fit(); if (++n < 14) requestAnimationFrame(step); else app.classList.remove('pvanim'); };   // ~.23s of frames
    requestAnimationFrame(step);
    track('preview_options', { open: !app.classList.contains('pvc') });
  };
  $('#reset').onclick = () => { try { window.dispatchEvent(new Event('sbx-reset')); } catch (_) {} if (tour) endTour(true); closeQPop(); closeAw(); app.classList.remove('pvc'); S = initial(); hist.stack = []; hist.redo = []; hist.last = ''; board.classList.remove('grid'); app.classList.remove('live'); $('#mEdit').classList.add('on'); $('#mLive').classList.remove('on'); closePop(); closeTypes(); stage.querySelectorAll('.finish').forEach(n => n.remove()); renderAll(); track('reset'); };

  function renderAll() { renderTitle(); renderLeft(); renderToolbar(); renderRight(); renderBoard(); renderTips(); fit(); if (typeof renderTourBtn === 'function') renderTourBtn(); }
  new ResizeObserver(fit).observe(stage);
  // re-measure auto scale once web fonts arrive (first render can use a fallback font)
  document.fonts.ready.then(renderBoard);
  document.fonts.addEventListener('loadingdone', () => renderBoard());
  renderAll();
  track('open');
  renderTourBtn();
  if (!tourSeen()) (document.fonts && document.fonts.ready || Promise.resolve()).then(() => setTimeout(() => { if (!tour) startTour(); }, 300));
})();
</script>
