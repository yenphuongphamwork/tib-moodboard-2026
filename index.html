<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Moodboard website 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dosis:wght@500;700&family=Lato:wght@400;700&display=swap">
<style>
  :root{--bg:#f4f4f2;--fg:#111;--sub:#444;--card:#fff;--ph:#e9e9e6;--rule:#111;--link:#1350DE;--shadow:#0002}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--fg:#f1f1ee;--sub:#b5b6b2;--card:#1d1f23;--ph:#26282d;--rule:#f1f1ee;--link:#7ea2ff;--shadow:#0008;color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#121316;--fg:#f1f1ee;--sub:#b5b6b2;--card:#1d1f23;--ph:#26282d;--rule:#f1f1ee;--link:#7ea2ff;--shadow:#0008;color-scheme:dark}
  body{background:var(--bg);color:var(--fg);font-family:Lato,system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{max-width:1300px;margin:0 auto;padding-block:32px 60px}
  h1{font-family:Dosis,system-ui,sans-serif;font-size:34px;margin:0 0 6px;text-wrap:balance}
  h2{font-family:Dosis,system-ui,sans-serif;font-size:24px;margin:44px 0 14px;padding-top:10px;border-top:2px solid var(--rule)}
  .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:20px;align-items:start}
  .g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:20px;align-items:start}
  figure{margin:0;min-width:0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 6px var(--shadow)}
  .m{aspect-ratio:16/10;background:#111}
  .m video,.m img{width:100%;height:100%;object-fit:contain;display:block}
  .m img{background:var(--ph)}
  .g2 figure>img{width:100%;display:block}
  figcaption{padding:12px 14px}
  b{display:block;font-family:Dosis,system-ui,sans-serif;font-size:18px;margin-bottom:4px}
  span{font-size:13px;color:var(--sub);line-height:1.45}
  a{color:var(--link);word-break:break-all}
  a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
</style>
</head>
